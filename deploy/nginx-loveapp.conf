# Drop into /etc/nginx/sites-available/ (or merge into existing pybot site).
# Certbot usually already manages listen 443 ssl вЂ” keep those lines from the
# current site if present. This file shows the location routing only.
#
# Goal:
#   /billing/unitpay  в†’ pyBot :8088 (UnitPay)
#   /health           в†’ pyBot :8088
#   /media/           в†’ MinIO/Silo :9000 (public photos)
#   everything else   в†’ LoveApp :3000

upstream loveapp_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pybot_upstream {
    server 127.0.0.1:8088;
    keepalive 8;
}

upstream love_minio_upstream {
    server 127.0.0.1:9000;
    keepalive 8;
}

server {
    server_name novayaglava.space;

    # HTTP в†’ HTTPS (certbot may replace this block)
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name novayaglava.space;

    # SSL managed by certbot вЂ” do not delete certificate lines after install:
    # ssl_certificate /etc/letsencrypt/live/novayaglava.space/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/novayaglava.space/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location = /billing/unitpay {
        proxy_pass http://pybot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://pybot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Path-style S3: /media/<bucket>/<key> в†’ MinIO /<bucket>/<key>
    location /media/ {
        proxy_pass http://love_minio_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://loveapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
