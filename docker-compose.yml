services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: love
      POSTGRES_PASSWORD: love
      POSTGRES_DB: loveapp
    ports:
      - "5432:5432"
    volumes:
      - love_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love -d loveapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Official minio/minio + minio/mc removed from Docker Hub (2026).
  # pgsty/silo is S3-compatible (same MINIO_* env / API).
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - love_minio:/data

  minio-init:
    image: amazon/aws-cli:2.27.31
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        sleep 3
        aws --endpoint-url http://minio:9000 s3 mb s3://loveapp 2>/dev/null || true
        printf '%s\n' '{
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": ["*"]},
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::loveapp/*"]
          }]
        }' > /tmp/policy.json
        aws --endpoint-url http://minio:9000 s3api put-bucket-policy \
          --bucket loveapp --policy file:///tmp/policy.json
        exit 0


volumes:
  love_pg:
  love_minio:
